name: Legacy Flutter Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  codegen-and-analyze:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 2.2.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '2.2.3'
          channel: stable
          cache: false

      - name: Show toolchain
        run: |
          flutter --version
          dart --version

      - name: Resolve locked dependencies
        run: flutter pub get

      - name: Generate Retrofit and JSON code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

  ios-unsigned-ipa:
    runs-on: macos-15-intel
    needs: codegen-and-analyze
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 2.2.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '2.2.3'
          channel: stable
          cache: false

      - name: Show Apple toolchain
        run: |
          flutter --version
          dart --version
          xcodebuild -version
          pod --version || true

      - name: Resolve locked dependencies
        run: flutter pub get

      - name: Generate Retrofit and JSON code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          rm -rf build/ipa/Payload
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/Runner.app
          cd build/ipa
          zip -qry dekluttered-unsigned.ipa Payload
          ls -lh dekluttered-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: dekluttered-unsigned-ipa
          path: build/ipa/dekluttered-unsigned.ipa
          if-no-files-found: error

      - name: Publish alpha release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.8.0-alpha.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" build/ipa/dekluttered-unsigned.ipa \
            --title "Dekluttered $TAG" \
            --notes "Automated alpha build from ${GITHUB_SHA}. Unsigned IPA intended for jailbreak testing." \
            --prerelease \
            --target "$GITHUB_SHA"
