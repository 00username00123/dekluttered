name: Legacy Flutter Check

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  codegen-and-analyze:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 2.2.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '2.2.3'
          channel: stable
          cache: false

      - name: Show toolchain
        run: |
          flutter --version
          dart --version

      - name: Resolve locked dependencies
        run: flutter pub get

      - name: Generate Retrofit and JSON code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze
